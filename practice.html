<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CSS Classes and Id selectors.</title>
    <style>
        .odd-number {
            background-color: pink;
            font-family: Verdana, Dejavu , sans-serif;
        }
        #even2 {
            color: blue;
            font-size: 36px;
        }
        .odd-number.two {
            font-size: 24px;
        }
        #even4 {
            background-color: green;
            font-size: 24px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="odd-number">Number 1-I am the first odd!</div>
    <p id="even2">Number 2-The first even!</p>
    <div class="odd-number two">Number 3-I'm also an odd!</div>
    <p id="even4">Number 4-I am the second even!</p>
</body>
</html>
